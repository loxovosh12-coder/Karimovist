<!doctype html>

  <title>Karimov Roman Artemovich — Official</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0f;
      --panel: rgba(255,255,255,.055);
      --panel-hover: rgba(255,255,255,.095);
      --line: rgba(255,255,255,.11);
      --muted: #9295a3;
      --text: #f5f6fb;
      --accent: #a8b7ff;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 18px;
      display: grid; place-items: center;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% -15%, rgba(94,112,205,.23), transparent 48%),
        radial-gradient(ellipse at 100% 100%, rgba(72,83,142,.12), transparent 40%),
        var(--bg);
    }
    .wrap { width: min(100%, 520px); }
    .topline { display:flex; align-items:center; justify-content:space-between; margin: 0 2px 24px; }
    .brand { font-size: 11px; letter-spacing: .22em; font-weight: 750; color: #c7c9d5; }
    .status { display:flex; align-items:center; gap:8px; color:#a9adba; font-size:11px; letter-spacing:.12em; }
    .dot { width:7px; height:7px; border-radius:50%; background:#83d6a5; box-shadow:0 0 12px #83d6a588; }
    .card {
      position:relative; overflow:hidden; border:1px solid var(--line); border-radius:28px;
      padding: clamp(25px, 6vw, 38px);
      background: linear-gradient(155deg, rgba(255,255,255,.075), rgba(255,255,255,.025) 48%, rgba(125,139,210,.045));
      box-shadow: 0 28px 90px rgba(0,0,0,.48);
      backdrop-filter: blur(18px);
    }
    .card:before {
      content:""; position:absolute; width:260px; height:260px; border-radius:50%;
      background:rgba(122,145,255,.10); filter:blur(70px); top:-170px; right:-80px; pointer-events:none;
    }
    .avatar {
      width:76px; height:76px; display:grid; place-items:center; border-radius:23px;
      border:1px solid rgba(255,255,255,.19);
      background:linear-gradient(145deg,#30364c,#171a25);
      color:#f4f5ff; font-size:25px; font-weight:800; letter-spacing:-.08em;
      box-shadow: inset 0 1px rgba(255,255,255,.15), 0 12px 35px rgba(0,0,0,.3);
    }
    .eyebrow { margin:27px 0 9px; color:var(--accent); font-size:10px; font-weight:750; letter-spacing:.23em; }
    h1 { margin:0; font-size:clamp(27px, 7vw, 38px); line-height:1.08; letter-spacing:-.055em; font-weight:760; }
    .subtitle { margin:12px 0 28px; color:var(--muted); font-size:14px; line-height:1.6; }
    .links { display:grid; gap:11px; }
    .link {
      display:flex; align-items:center; gap:14px; padding:15px 16px;
      min-height:75px; text-decoration:none; color:var(--text);
      border:1px solid var(--line); border-radius:17px; background:var(--panel);
      transition:transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .link:hover { transform:translateY(-2px); background:var(--panel-hover); border-color:rgba(168,183,255,.35); }
    .link:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .ico { width:42px; height:42px; flex:0 0 42px; display:grid; place-items:center; border-radius:13px; background:rgba(255,255,255,.075); color:#e9ebf8; }
    .ico svg { width:21px; height:21px; }
    .label { min-width:0; flex:1; }
    .label strong { display:block; font-size:14px; font-weight:680; letter-spacing:.005em; }
    .label span { display:block; margin-top:5px; color:var(--muted); font-size:11px; overflow-wrap:anywhere; }
    .arrow { color:#777d91; font-size:20px; padding-left:5px; }
    .footer { display:flex; justify-content:space-between; gap:12px; margin:22px 3px 0; color:#666b7a; font-size:10px; letter-spacing:.09em; }
    .footer span:last-child { text-align:right; }
    @media (max-width:380px) {
      body { padding:20px 12px; }
      .card { border-radius:23px; padding:23px 19px; }
      .link { padding:13px; }
      .footer { font-size:9px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; } }
  </style>
</head>
